name: Publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: vars.PUBLISH_SITE == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_content.py
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set Jekyll base path
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path("docs/_config.yml")
          config = path.read_text(encoding="utf-8")
          replacement = "baseurl: " + json.dumps(os.environ["SITE_BASE"])
          config, count = re.subn(
              r"(?m)^baseurl:.*$",
              lambda match: replacement,
              config,
          )
          if count != 1:
              raise SystemExit("Expected exactly one baseurl setting")
          path.write_text(config, encoding="utf-8")
          PY

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Check generated links
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: python scripts/check_site.py _site --baseurl "$SITE_BASE"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
