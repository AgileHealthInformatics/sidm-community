name: Publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: vars.PUBLISH_SITE == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      discussions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_content.py
      - run: python scripts/project_automation.py validate
      - run: python -m unittest discover -s tests -v
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Resolve project discussions
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_DISCUSSIONS_ENABLED: ${{ vars.PROJECT_DISCUSSIONS_ENABLED }}
          PROJECT_DISCUSSION_CATEGORY: ${{ vars.PROJECT_DISCUSSION_CATEGORY || 'General' }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/project_automation.py sync
      - name: Set Jekyll base path
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: python scripts/set_base_path.py
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Check generated links
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: python scripts/check_site.py _site --baseurl "$SITE_BASE"
      - name: Save project discussion mapping
        uses: actions/upload-artifact@v4
        with:
          name: project-discussion-links
          path: docs/_data/project_discussions.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
